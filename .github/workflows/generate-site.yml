name: Generate Directory Listing, Zip, and Deploy Site

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Directory Listings
        uses: gacts/directory-listing@v1
        with:
          path: .

      - name: Create Full Site Zip Archive
        run: |
          zip -r full-site-archive.zip . -x "*.git*"

      - name: Upload Full Site Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-site-zip
          path: full-site-archive.zip

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Uploads the entire repository directory (including generated directory listings)
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-archive
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
